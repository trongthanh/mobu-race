<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mobu · Model studio</title>
  <link rel="icon" href="data:,">
  <style>
    *{box-sizing:border-box}body{margin:0;background:#faf7ef;color:#483a2b;font:15px system-ui,sans-serif}main{display:grid;grid-template-columns:1fr 280px;height:100dvh}#viewport{min-width:0;position:relative}canvas{display:block;width:100%;height:100%}aside{padding:28px 22px;border-left:2px solid #e8ddc6;background:#fffcf5;overflow:auto}h1{font-size:25px;margin:0 0 8px}p{line-height:1.6;color:#80705a}label{display:block;font-weight:650;margin:24px 0 10px}button,select{font:inherit;border:2px solid #dfcfad;border-radius:10px;padding:9px 12px;background:#fffaf0;color:inherit;cursor:pointer}button:hover{background:#ffedb9}select,input[type=range]{width:100%}.angles{display:flex;flex-wrap:wrap;gap:7px}a{color:#94671a}#caption{position:absolute;bottom:24px;left:24px;color:#8b7b65;pointer-events:none}small{display:block;line-height:1.6;margin-top:26px;color:#8b7b65}@media(max-width:700px){main{grid-template-columns:1fr;grid-template-rows:65dvh auto;height:auto}aside{border-left:0;border-top:2px solid #e8ddc6}}
  </style>
</head>
<body>
<main>
  <div id="viewport"><div id="caption">Canonical rig · procedural geometry · no textures</div></div>
  <aside>
    <h1>Mobu studio</h1>
    <p>A big soft grin.<br>A little victory dance.</p>
    <label for="pose">Pose</label>
    <select id="pose"><option value="rest">Reference / still</option><option value="idle">Idle</option><option value="run">Running</option><option value="celebrate">Celebrate!</option></select>
    <label for="smile">Smile <output id="smile-value">0%</output></label>
    <input id="smile" type="range" min="0" max="1" value="0" step="0.01">
    <label>View</label>
    <div class="angles"><button data-yaw="0">Front</button><button data-yaw="40">¾</button><button data-yaw="90">Side</button><button data-yaw="180">Back</button></div>
    <label for="yaw">Turntable</label><input id="yaw" type="range" min="-180" max="180" value="0">
    <label for="outfit">Wardrobe</label>
    <select id="outfit"><option value="classic">Signature boxing shorts</option><option value="plain">Plain boxing shorts</option><option value="pants">Long pants</option><option value="skirt">Skirt (rare)</option><option value="seeded">Seeded race outfit</option></select>
    <small>Smile shapes the actual mesh. Celebration adds happy eyes, raised arms and grounded victory hops.<br><br><a href="/">← Back to the race</a></small>
  </aside>
</main>
<script type="module" src="/js/mobu-lab.js"></script>
</body>
</html>
